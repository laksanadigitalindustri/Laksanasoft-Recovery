name: Build Feature-Rich Custom Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Recovery for beyond2lte
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential ccache curl git gperf libxml2-utils lzop pngcrush schedtool squashfs-tools zlib1g-dev g++-multilib libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip tar lz4 python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP Source Tree
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Laksanasoft"
          git config --global user.email "laksanadigitalindustri@gmail.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree for Samsung Galaxy S10 Plus
        run: |
          cd ~/twrp
          git clone --depth=1 https://github.com/TeamWin/android_device_samsung_beyond2lte.git device/samsung/beyond2lte

      - name: Compile Custom Recovery Image
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/build_twrp.sh
          bash $GITHUB_WORKSPACE/scripts/build_twrp.sh

      - name: Package Odin Flashable TAR and LZ4 Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cd ~/twrp
          find out/ -name "recovery.img" -exec cp {} $GITHUB_WORKSPACE/output/recovery.img \;
          if [ -f "$GITHUB_WORKSPACE/output/recovery.img" ]; then
            cd $GITHUB_WORKSPACE/output
            tar -cvf Laksanasoft-NetHunter-Recovery-beyond2lte.tar recovery.img
            lz4 -9 recovery.img recovery.img.lz4
            tar -cvf Laksanasoft-NetHunter-Recovery-beyond2lte-lz4.tar recovery.img.lz4
          else
            echo "[!] Warning: recovery.img not found, packaging output directory contents..."
            cp -rf out/target/product/* $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          fi

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laksanasoft-NetHunter-Custom-Recovery-beyond2lte
          path: output/*